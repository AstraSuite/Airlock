[package]
name = "airlock-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "astra-airlock"
path = "src/main.rs"

[dependencies]
cxx = "1.0.95"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zbus = "4"
regex = "1"

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
